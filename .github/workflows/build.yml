# SPDX-License-Identifier: GPL-3.0-only
# Host tests (the engine against Nuked-OPN2, the tracker, the app in the simulator); the device package
# is added with the app.
name: build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Host tests
        run: tests/run_tests.sh build/wav
      - uses: actions/upload-artifact@v4
        with:
          name: engine-wavs-${{ github.sha }}
          path: build/wav
